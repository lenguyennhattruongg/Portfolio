name: Build Verification (Vite CI)

# Quyền tối thiểu chỉ đọc mã nguồn (No deploy, no write)
permissions:
  contents: read

# Chỉ kích hoạt thủ công qua workflow_dispatch hoặc khi mở Pull Request vào nhánh develop
'on':
  workflow_dispatch:
  pull_request:
    branches:
      - develop

jobs:
  build-and-verify:
    name: Vite Multi-page Production Build & Artifact Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies cleanly (npm ci)
        run: npm ci

      - name: Execute production build (npm run build)
        run: npm run build

      - name: Verify all 7 required HTML artifacts exist in dist/
        run: |
          echo "=== BẮT ĐẦU XÁC MINH CÁC ARTIFACTS HTML TRONG DIST/ ==="
          
          REQUIRED_FILES=(
            "dist/index.html"
            "dist/members/nguyen-xuan-hieu/index.html"
            "dist/members/le-nguyen-nhat-truong/index.html"
            "dist/members/nguyen-thi-thao-nhu/index.html"
            "dist/members/nguyen-pham-y-huynh/index.html"
            "dist/members/le-huu-chau/index.html"
            "dist/members/nguyen-anh-thu/index.html"
          )

          MISSING_COUNT=0

          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo " [PASS] Tìm thấy: $file"
            else
              echo " [FAIL] THIẾU ARTIFACT BẮT BUỘC: $file"
              MISSING_COUNT=$((MISSING_COUNT + 1))
            fi
          done

          if [ $MISSING_COUNT -gt 0 ]; then
            echo "=== THẤT BẠI: Có $MISSING_COUNT file HTML bị thiếu sau khi build Vite! ==="
            exit 1
          fi

          echo "=== XÁC MINH HOÀN TẤT: Đầy đủ cả 7/7 file HTML đầu ra. ==="
          echo "Liệt kê chi tiết cấu trúc thư mục dist/:"
          ls -la dist/
          if [ -d "dist/assets" ]; then
            echo "Chi tiết tài nguyên trong dist/assets/:"
            ls -la dist/assets/
          else
            echo "Lưu ý: Không tìm thấy thư mục dist/assets/. Không có asset bundle riêng hoặc cần kiểm tra cấu trúc đầu ra."
          fi
