name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Quyền hạn cần thiết để GitHub Actions tự động ghi và phát hành lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Giới hạn chỉ chạy một tiến trình deploy đồng thời, tránh xung đột phiên bản
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package MPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Multi-Page Application (MPA)
        run: npm run build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
