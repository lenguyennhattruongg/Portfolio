<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#F7FAF5;font-family:'Plus Jakarta Sans',sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#404E3B" flood-opacity="0.12"/>
    </filter>
    <marker id="erd-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7B9669"/>
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="4" fill="#404E3B"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="40" y="20" width="1120" height="55" rx="10" fill="#404E3B"/>
  <text x="600" y="48" fill="#E6E6E6" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    TRUNG TÂM THÚ Y — SƠ ĐỒ MÔ HÌNH THỰC THỂ CSDL (RELATIONAL ERD 3NF)
  </text>
  <text x="600" y="64" fill="#BAC8B1" font-size="11" text-anchor="middle" dominant-baseline="middle">
    Cơ sở dữ liệu MySQL 8.0 • Quản lý Hồ sơ Bệnh án điện tử, Chủ nuôi, Lịch hẹn &amp; Đơn thuốc
  </text>

  <!-- Entity 1: USERS (Row 1, Col 1) -->
  <g filter="url(#shadow)" transform="translate(60, 100)">
    <rect width="220" height="175" rx="8" fill="#FFFFFF" stroke="#404E3B" stroke-width="1.5"/>
    <path d="M 0 0 L 220 0 L 220 30 L 0 30 Z" fill="#404E3B" rx="8"/>
    <text x="110" y="20" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">USERS (Tài khoản)</text>
    <text x="15" y="52" fill="#C53030" font-size="11" font-weight="700">PK  user_id : INT</text>
    <text x="15" y="72" fill="#3D4A38" font-size="11">    username : VARCHAR(50)</text>
    <text x="15" y="92" fill="#3D4A38" font-size="11">    email : VARCHAR(100)</text>
    <text x="15" y="112" fill="#3D4A38" font-size="11">    phone : VARCHAR(20)</text>
    <text x="15" y="132" fill="#3D4A38" font-size="11">    role : ENUM(Owner,Doctor)</text>
    <text x="15" y="152" fill="#3D4A38" font-size="11">    created_at : DATETIME</text>
  </g>

  <!-- Entity 2: PETS (Row 1, Col 2) -->
  <g filter="url(#shadow)" transform="translate(360, 100)">
    <rect width="230" height="190" rx="8" fill="#FFFFFF" stroke="#404E3B" stroke-width="1.5"/>
    <path d="M 0 0 L 230 0 L 230 30 L 0 30 Z" fill="#404E3B" rx="8"/>
    <text x="115" y="20" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">PETS (Hồ sơ Thú cưng)</text>
    <text x="15" y="52" fill="#C53030" font-size="11" font-weight="700">PK  pet_id : INT</text>
    <text x="15" y="72" fill="#2B6CB0" font-size="11">FK  owner_id : INT</text>
    <text x="15" y="92" fill="#3D4A38" font-size="11">    pet_name : VARCHAR(100)</text>
    <text x="15" y="112" fill="#3D4A38" font-size="11">    species : VARCHAR(50)</text>
    <text x="15" y="132" fill="#3D4A38" font-size="11">    breed : VARCHAR(100)</text>
    <text x="15" y="152" fill="#3D4A38" font-size="11">    weight_kg : DECIMAL(5,2)</text>
    <text x="15" y="172" fill="#3D4A38" font-size="11">    microchip_no : VARCHAR(50)</text>
  </g>

  <!-- Entity 3: APPOINTMENTS (Row 1, Col 3) -->
  <g filter="url(#shadow)" transform="translate(660, 100)">
    <rect width="230" height="175" rx="8" fill="#FFFFFF" stroke="#404E3B" stroke-width="1.5"/>
    <path d="M 0 0 L 230 0 L 230 30 L 0 30 Z" fill="#7B9669" rx="8"/>
    <text x="115" y="20" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">APPOINTMENTS (Lịch hẹn)</text>
    <text x="15" y="52" fill="#C53030" font-size="11" font-weight="700">PK  appointment_id : INT</text>
    <text x="15" y="72" fill="#2B6CB0" font-size="11">FK  pet_id : INT</text>
    <text x="15" y="92" fill="#2B6CB0" font-size="11">FK  doctor_id : INT</text>
    <text x="15" y="112" fill="#3D4A38" font-size="11">    scheduled_time : DATETIME</text>
    <text x="15" y="132" fill="#3D4A38" font-size="11">    reason : VARCHAR(255)</text>
    <text x="15" y="152" fill="#3D4A38" font-size="11">    status : ENUM(Pending,Done)</text>
  </g>

  <!-- Entity 4: MEDICAL_RECORDS (Row 1, Col 4) -->
  <g filter="url(#shadow)" transform="translate(950, 100)">
    <rect width="200" height="190" rx="8" fill="#FFFFFF" stroke="#404E3B" stroke-width="1.5"/>
    <path d="M 0 0 L 200 0 L 200 30 L 0 30 Z" fill="#404E3B" rx="8"/>
    <text x="100" y="20" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">MEDICAL_RECORDS</text>
    <text x="15" y="52" fill="#C53030" font-size="11" font-weight="700">PK  record_id : INT</text>
    <text x="15" y="72" fill="#2B6CB0" font-size="11">FK  pet_id : INT</text>
    <text x="15" y="92" fill="#2B6CB0" font-size="11">FK  appointment_id : INT</text>
    <text x="15" y="112" fill="#3D4A38" font-size="11">    diagnosis : TEXT</text>
    <text x="15" y="132" fill="#3D4A38" font-size="11">    treatment : TEXT</text>
    <text x="15" y="152" fill="#3D4A38" font-size="11">    visit_date : DATETIME</text>
    <text x="15" y="172" fill="#3D4A38" font-size="11">    next_checkup : DATE</text>
  </g>

  <!-- Entity 5: ORDERS (Row 2, Col 1) -->
  <g filter="url(#shadow)" transform="translate(60, 340)">
    <rect width="220" height="160" rx="8" fill="#FFFFFF" stroke="#404E3B" stroke-width="1.5"/>
    <path d="M 0 0 L 220 0 L 220 30 L 0 30 Z" fill="#404E3B" rx="8"/>
    <text x="110" y="20" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">ORDERS (Đơn sản phẩm)</text>
    <text x="15" y="52" fill="#C53030" font-size="11" font-weight="700">PK  order_id : INT</text>
    <text x="15" y="72" fill="#2B6CB0" font-size="11">FK  user_id : INT</text>
    <text x="15" y="92" fill="#3D4A38" font-size="11">    total_price : DECIMAL(10,2)</text>
    <text x="15" y="112" fill="#3D4A38" font-size="11">    payment_method : VARCHAR</text>
    <text x="15" y="132" fill="#3D4A38" font-size="11">    status : VARCHAR(20)</text>
    <text x="15" y="152" fill="#3D4A38" font-size="11">    order_date : DATETIME</text>
  </g>

  <!-- Entity 6: PRESCRIPTIONS (Row 2, Col 4) -->
  <g filter="url(#shadow)" transform="translate(950, 340)">
    <rect width="200" height="160" rx="8" fill="#FFFFFF" stroke="#404E3B" stroke-width="1.5"/>
    <path d="M 0 0 L 200 0 L 200 30 L 0 30 Z" fill="#6C8480" rx="8"/>
    <text x="100" y="20" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">PRESCRIPTIONS (Đơn thuốc)</text>
    <text x="15" y="52" fill="#C53030" font-size="11" font-weight="700">PK  prescription_id : INT</text>
    <text x="15" y="72" fill="#2B6CB0" font-size="11">FK  record_id : INT</text>
    <text x="15" y="92" fill="#3D4A38" font-size="11">    medication_name : VARCHAR</text>
    <text x="15" y="112" fill="#3D4A38" font-size="11">    dosage : VARCHAR(50)</text>
    <text x="15" y="132" fill="#3D4A38" font-size="11">    duration_days : INT</text>
    <text x="15" y="152" fill="#3D4A38" font-size="11">    instructions : TEXT</text>
  </g>

  <!-- Summary Box -->
  <g filter="url(#shadow)" transform="translate(60, 560)">
    <rect width="1080" height="195" rx="10" fill="#FFFFFF" stroke="#7B9669" stroke-width="1.5"/>
    <rect width="1080" height="30" rx="10" fill="#EEF2EB"/>
    <text x="540" y="20" fill="#404E3B" font-size="13" font-weight="700" text-anchor="middle">
      TỔNG QUAN THIẾT KẾ DỮ LIỆU BỆNH ÁN ĐIỆN TỬ &amp; ĐẶT LỊCH KHÁM THÚ Y
    </text>
    <text x="25" y="60" fill="#404E3B" font-size="12" font-weight="700">• Quản lý Hồ sơ Bệnh án liên kết (EHR):</text>
    <text x="35" y="80" fill="#3D4A38" font-size="11">Mỗi Thú cưng có lịch sử bệnh án đầy đủ gắn liền với Bác sĩ phụ trách, Đơn thuốc, Lịch hẹn và nhắc lịch tái khám tự động qua Celery.</text>
    
    <text x="25" y="110" fill="#404E3B" font-size="12" font-weight="700">• Toàn vẹn Dữ liệu Khóa ngoại:</text>
    <text x="35" y="130" fill="#3D4A38" font-size="11">Các mối quan hệ 1:N giữa Users ➔ Pets, Pets ➔ Appointments, Appointments ➔ MedicalRecords được thiết lập chặt chẽ bằng ràng buộc Foreign Key.</text>
    
    <text x="25" y="160" fill="#404E3B" font-size="12" font-weight="700">• Tối ưu Truy vấn &amp; Index:</text>
    <text x="35" y="180" fill="#3D4A38" font-size="11">Chỉ mục Index trên (pet_id, scheduled_time) và (owner_id) giúp các câu truy vấn lọc lịch khám và bệnh án phản hồi tức thì.</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 100% ORTHOGONAL 90-DEGREE RELATIONSHIP CONNECTORS (NO PIERCING)           -->
  <!-- ========================================================================= -->

  <!-- 1. USERS -> PETS (1:N, owner_id) [Straight horizontal through Gutter] -->
  <path d="M 280 160 L 360 160" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="320" y="152" fill="#404E3B" font-size="10" font-weight="700" text-anchor="middle">1:N</text>

  <!-- 2. USERS -> ORDERS (1:N, user_id) [Straight vertical through Gutter] -->
  <path d="M 170 275 L 170 340" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="180" y="305" fill="#404E3B" font-size="10" font-weight="700">1:N</text>

  <!-- 3. USERS (Doctor) -> APPOINTMENTS (1:N, doctor_id) [Orthogonal Around Top Margin y=85] -->
  <path d="M 170 100 L 170 85 L 775 85 L 775 100" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="470" y="80" fill="#404E3B" font-size="11" font-weight="700" text-anchor="middle">USERS (Doctor) ➔ APPOINTMENTS (1:N)</text>

  <!-- 4. PETS -> APPOINTMENTS (1:N, pet_id) [Straight horizontal through Gutter] -->
  <path d="M 590 160 L 660 160" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="625" y="152" fill="#404E3B" font-size="10" font-weight="700" text-anchor="middle">1:N</text>

  <!-- 5. APPOINTMENTS -> MEDICAL_RECORDS (1:1 / 1:N, appointment_id) [Straight horizontal] -->
  <path d="M 890 160 L 950 160" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="920" y="152" fill="#404E3B" font-size="10" font-weight="700" text-anchor="middle">1:N</text>

  <!-- 6. MEDICAL_RECORDS -> PRESCRIPTIONS (1:N, record_id) [Straight vertical] -->
  <path d="M 1050 290 L 1050 340" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="1060" y="315" fill="#404E3B" font-size="10" font-weight="700">1:N</text>

  <!-- 7. PETS -> MEDICAL_RECORDS (1:N, pet_id history) [Orthogonal in Middle Gutter y=315] -->
  <path d="M 475 290 L 475 315 L 920 315 L 920 230 L 950 230" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="700" y="310" fill="#404E3B" font-size="10" font-weight="700" text-anchor="middle">PETS ➔ MEDICAL RECORDS (1:N)</text>
</svg>