<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#F7FAF5;font-family:'Plus Jakarta Sans',sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#404E3B" flood-opacity="0.12"/>
    </filter>
    <marker id="erd-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7B9669"/>
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="4" fill="#404E3B"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="40" y="20" width="1120" height="55" rx="10" fill="#404E3B"/>
  <text x="600" y="48" fill="#E6E6E6" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    HIUNXSTAR — SƠ ĐỒ MÔ HÌNH THỰC THỂ CSDL CHUẨN 3NF (RELATIONAL ERD)
  </text>
  <text x="600" y="64" fill="#BAC8B1" font-size="11" text-anchor="middle" dominant-baseline="middle">
    Cơ sở dữ liệu Microsoft SQL Server • Khóa chính PK, Khóa ngoại FK, Chuẩn hóa 3NF không dư thừa
  </text>

  <!-- Entity 1: USERS (Row 1, Col 1) -->
  <g filter="url(#shadow)" transform="translate(60, 100)">
    <rect width="220" height="175" rx="8" fill="#FFFFFF" stroke="#404E3B" stroke-width="1.5"/>
    <path d="M 0 0 L 220 0 L 220 30 L 0 30 Z" fill="#404E3B" rx="8"/>
    <text x="110" y="20" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">USERS (Người dùng)</text>
    <text x="15" y="52" fill="#C53030" font-size="11" font-weight="700">PK  user_id : INT</text>
    <text x="15" y="72" fill="#2B6CB0" font-size="11">FK  role_id : INT</text>
    <text x="15" y="92" fill="#3D4A38" font-size="11">    full_name : NVARCHAR(100)</text>
    <text x="15" y="112" fill="#3D4A38" font-size="11">    email : VARCHAR(100) UNIQUE</text>
    <text x="15" y="132" fill="#3D4A38" font-size="11">    password_hash : VARCHAR(255)</text>
    <text x="15" y="152" fill="#3D4A38" font-size="11">    created_at : DATETIME</text>
  </g>

  <!-- Entity 2: ROLES (Row 2, Col 1) -->
  <g filter="url(#shadow)" transform="translate(60, 340)">
    <rect width="220" height="120" rx="8" fill="#FFFFFF" stroke="#404E3B" stroke-width="1.5"/>
    <path d="M 0 0 L 220 0 L 220 30 L 0 30 Z" fill="#7B9669" rx="8"/>
    <text x="110" y="20" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">ROLES (Vai trò)</text>
    <text x="15" y="52" fill="#C53030" font-size="11" font-weight="700">PK  role_id : INT</text>
    <text x="15" y="74" fill="#3D4A38" font-size="11">    role_name : VARCHAR(50)</text>
    <text x="15" y="96" fill="#3D4A38" font-size="11">    permissions : NVARCHAR(MAX)</text>
  </g>

  <!-- Entity 3: MOVIES (Row 1, Col 2) -->
  <g filter="url(#shadow)" transform="translate(360, 100)">
    <rect width="230" height="190" rx="8" fill="#FFFFFF" stroke="#404E3B" stroke-width="1.5"/>
    <path d="M 0 0 L 230 0 L 230 30 L 0 30 Z" fill="#404E3B" rx="8"/>
    <text x="115" y="20" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">MOVIES (Phim)</text>
    <text x="15" y="52" fill="#C53030" font-size="11" font-weight="700">PK  movie_id : INT</text>
    <text x="15" y="72" fill="#3D4A38" font-size="11">    title : NVARCHAR(200)</text>
    <text x="15" y="92" fill="#3D4A38" font-size="11">    duration_mins : INT</text>
    <text x="15" y="112" fill="#3D4A38" font-size="11">    release_date : DATE</text>
    <text x="15" y="132" fill="#3D4A38" font-size="11">    age_rating : VARCHAR(10)</text>
    <text x="15" y="152" fill="#3D4A38" font-size="11">    poster_url : VARCHAR(255)</text>
    <text x="15" y="172" fill="#3D4A38" font-size="11">    status : VARCHAR(20)</text>
  </g>

  <!-- Entity 4: SHOWTIMES (Row 2, Col 2) -->
  <g filter="url(#shadow)" transform="translate(360, 340)">
    <rect width="230" height="170" rx="8" fill="#FFFFFF" stroke="#404E3B" stroke-width="1.5"/>
    <path d="M 0 0 L 230 0 L 230 30 L 0 30 Z" fill="#404E3B" rx="8"/>
    <text x="115" y="20" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">SHOWTIMES (Suất chiếu)</text>
    <text x="15" y="52" fill="#C53030" font-size="11" font-weight="700">PK  showtime_id : INT</text>
    <text x="15" y="72" fill="#2B6CB0" font-size="11">FK  movie_id : INT</text>
    <text x="15" y="92" fill="#2B6CB0" font-size="11">FK  auditorium_id : INT</text>
    <text x="15" y="112" fill="#3D4A38" font-size="11">    start_time : DATETIME</text>
    <text x="15" y="132" fill="#3D4A38" font-size="11">    end_time : DATETIME</text>
    <text x="15" y="152" fill="#3D4A38" font-size="11">    base_price : DECIMAL(10,2)</text>
  </g>

  <!-- Entity 5: AUDITORIUMS (Row 1, Col 3) -->
  <g filter="url(#shadow)" transform="translate(660, 100)">
    <rect width="220" height="160" rx="8" fill="#FFFFFF" stroke="#404E3B" stroke-width="1.5"/>
    <path d="M 0 0 L 220 0 L 220 30 L 0 30 Z" fill="#6C8480" rx="8"/>
    <text x="110" y="20" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">AUDITORIUMS (Phòng chiếu)</text>
    <text x="15" y="52" fill="#C53030" font-size="11" font-weight="700">PK  auditorium_id : INT</text>
    <text x="15" y="72" fill="#3D4A38" font-size="11">    name : NVARCHAR(50)</text>
    <text x="15" y="92" fill="#3D4A38" font-size="11">    total_rows : INT</text>
    <text x="15" y="112" fill="#3D4A38" font-size="11">    total_cols : INT</text>
    <text x="15" y="132" fill="#3D4A38" font-size="11">    sound_system : VARCHAR(50)</text>
  </g>

  <!-- Entity 6: SEATS (Row 2, Col 3) -->
  <g filter="url(#shadow)" transform="translate(660, 310)">
    <rect width="220" height="175" rx="8" fill="#FFFFFF" stroke="#404E3B" stroke-width="1.5"/>
    <path d="M 0 0 L 220 0 L 220 30 L 0 30 Z" fill="#6C8480" rx="8"/>
    <text x="110" y="20" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">SEATS (Ghế ngồi)</text>
    <text x="15" y="52" fill="#C53030" font-size="11" font-weight="700">PK  seat_id : INT</text>
    <text x="15" y="72" fill="#2B6CB0" font-size="11">FK  auditorium_id : INT</text>
    <text x="15" y="92" fill="#3D4A38" font-size="11">    seat_type : VARCHAR(20)</text>
    <text x="15" y="112" fill="#3D4A38" font-size="11">    seat_row : CHAR(2)</text>
    <text x="15" y="132" fill="#3D4A38" font-size="11">    seat_number : INT</text>
    <text x="15" y="152" fill="#3D4A38" font-size="11">    is_active : BIT</text>
  </g>

  <!-- Entity 7: ORDERS (Row 1, Col 4) -->
  <g filter="url(#shadow)" transform="translate(940, 100)">
    <rect width="200" height="175" rx="8" fill="#FFFFFF" stroke="#404E3B" stroke-width="1.5"/>
    <path d="M 0 0 L 200 0 L 200 30 L 0 30 Z" fill="#404E3B" rx="8"/>
    <text x="100" y="20" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">ORDERS (Đơn đặt vé)</text>
    <text x="15" y="52" fill="#C53030" font-size="11" font-weight="700">PK  order_id : INT</text>
    <text x="15" y="72" fill="#2B6CB0" font-size="11">FK  user_id : INT</text>
    <text x="15" y="92" fill="#3D4A38" font-size="11">    order_code : VARCHAR(30)</text>
    <text x="15" y="112" fill="#3D4A38" font-size="11">    order_date : DATETIME</text>
    <text x="15" y="132" fill="#3D4A38" font-size="11">    total_amount : DECIMAL</text>
    <text x="15" y="152" fill="#3D4A38" font-size="11">    payment_status : VARCHAR</text>
  </g>

  <!-- Entity 8: TICKETS (Row 2, Col 4) -->
  <g filter="url(#shadow)" transform="translate(940, 330)">
    <rect width="200" height="190" rx="8" fill="#FFFFFF" stroke="#404E3B" stroke-width="1.5"/>
    <path d="M 0 0 L 200 0 L 200 30 L 0 30 Z" fill="#404E3B" rx="8"/>
    <text x="100" y="20" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">TICKETS (Vé chi tiết)</text>
    <text x="15" y="52" fill="#C53030" font-size="11" font-weight="700">PK  ticket_id : INT</text>
    <text x="15" y="72" fill="#2B6CB0" font-size="11">FK  order_id : INT</text>
    <text x="15" y="92" fill="#2B6CB0" font-size="11">FK  showtime_id : INT</text>
    <text x="15" y="112" fill="#2B6CB0" font-size="11">FK  seat_id : INT</text>
    <text x="15" y="132" fill="#3D4A38" font-size="11">    ticket_price : DECIMAL</text>
    <text x="15" y="152" fill="#3D4A38" font-size="11">    seat_status : VARCHAR</text>
    <text x="15" y="172" fill="#3D4A38" font-size="11">    qr_code_hash : VARCHAR</text>
  </g>

  <!-- Summary Box: Constraints, Stored Procedures & Views -->
  <g filter="url(#shadow)" transform="translate(60, 560)">
    <rect width="1080" height="195" rx="10" fill="#FFFFFF" stroke="#7B9669" stroke-width="1.5"/>
    <rect width="1080" height="30" rx="10" fill="#EEF2EB"/>
    <text x="540" y="20" fill="#404E3B" font-size="13" font-weight="700" text-anchor="middle">
      CHUẨN HÓA CSDL 3NF • GIAO DỊCH ACID • STORED PROCEDURES &amp; VIEWS
    </text>
    <text x="25" y="60" fill="#404E3B" font-size="12" font-weight="700">• Ràng buộc Chuẩn 3NF:</text>
    <text x="35" y="80" fill="#3D4A38" font-size="11">Tách biệt bảng Phim, Rạp, Ghế, Suất chiếu; loại trừ hoàn toàn dư thừa dữ liệu và dị thường cập nhật (Update Anomalies).</text>
    
    <text x="25" y="110" fill="#404E3B" font-size="12" font-weight="700">• Cơ chế Transaction &amp; Khóa ghế (Seat Locking):</text>
    <text x="35" y="130" fill="#3D4A38" font-size="11">Sử dụng BEGIN TRANSACTION và COMMIT với ROWLOCK khi khách chọn ghế; tự động giải phóng ghế sau 10 phút nếu không thanh toán.</text>
    
    <text x="25" y="160" fill="#404E3B" font-size="12" font-weight="700">• Stored Procedures &amp; Views:</text>
    <text x="35" y="180" fill="#3D4A38" font-size="11">sp_LockSeatsForBooking, sp_ConfirmTicketOrder, sp_CancelExpiredSeatLocks | Views: v_AvailableSeatsOverview, v_DailyRevenueByMovie.</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 100% ORTHOGONAL 90-DEGREE RELATIONSHIP CONNECTORS (NO PIERCING)           -->
  <!-- ========================================================================= -->

  <!-- 1. ROLES -> USERS (1:N) [Straight vertical through Gutter] -->
  <path d="M 170 340 L 170 275" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="180" y="305" fill="#404E3B" font-size="10" font-weight="700">1:N</text>

  <!-- 2. MOVIES -> SHOWTIMES (1:N) [Straight vertical through Gutter] -->
  <path d="M 475 290 L 475 340" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="485" y="318" fill="#404E3B" font-size="10" font-weight="700">1:N</text>

  <!-- 3. AUDITORIUMS -> SEATS (1:N) [Straight vertical through Gutter] -->
  <path d="M 770 260 L 770 310" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="780" y="288" fill="#404E3B" font-size="10" font-weight="700">1:N</text>

  <!-- 4. AUDITORIUMS -> SHOWTIMES (1:N) [Orthogonal Gutter Channel x=625] -->
  <path d="M 660 210 L 625 210 L 625 425 L 590 425" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="630" y="325" fill="#404E3B" font-size="10" font-weight="700">1:N</text>

  <!-- 5. USERS -> ORDERS (1:N) [Orthogonal Around Top Margin y=85, ZERO CUTTING] -->
  <path d="M 170 100 L 170 85 L 1040 85 L 1040 100" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="600" y="80" fill="#404E3B" font-size="11" font-weight="700" text-anchor="middle">USERS ➔ ORDERS (1:N)</text>

  <!-- 6. ORDERS -> TICKETS (1:N) [Straight vertical through Gutter] -->
  <path d="M 1040 275 L 1040 330" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="1050" y="305" fill="#404E3B" font-size="10" font-weight="700">1:N</text>

  <!-- 7. SEATS -> TICKETS (1:N) [Straight horizontal through Gutter] -->
  <path d="M 880 400 L 940 400" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="910" y="392" fill="#404E3B" font-size="10" font-weight="700" text-anchor="middle">1:N</text>

  <!-- 8. SHOWTIMES -> TICKETS (1:N) [Orthogonal Around Bottom Gutter y=535, ZERO CUTTING] -->
  <path d="M 475 510 L 475 535 L 1040 535 L 1040 520" fill="none" stroke="#7B9669" stroke-width="2.5" marker-start="url(#dot)" marker-end="url(#erd-arrow)"/>
  <text x="750" y="548" fill="#404E3B" font-size="11" font-weight="700" text-anchor="middle">SHOWTIMES ➔ TICKETS (1:N)</text>
</svg>