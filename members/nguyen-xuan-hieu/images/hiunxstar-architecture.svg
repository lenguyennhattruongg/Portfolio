<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" style="background:#F7FAF5;font-family:'Plus Jakarta Sans',sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#404E3B" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7B9669"/>
    </marker>
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#404E3B"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="40" y="20" width="1120" height="60" rx="12" fill="#404E3B"/>
  <text x="600" y="48" fill="#E6E6E6" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    HIUNXSTAR — KIẾN TRÚC HỆ THỐNG 3-TIER ENTERPRISE MVC
  </text>
  <text x="600" y="66" fill="#BAC8B1" font-size="12" text-anchor="middle" dominant-baseline="middle">
    Tầng Trình diễn (HTML5/CSS/JS) • Tầng Nghiệp vụ (Pure PHP MVC Core) • Tầng Dữ liệu (MS SQL Server 3NF)
  </text>

  <!-- TIER 1: PRESENTATION TIER -->
  <g filter="url(#shadow)">
    <rect x="50" y="100" width="1100" height="150" rx="14" fill="#FFFFFF" stroke="#BAC8B1" stroke-width="1.5"/>
    <rect x="50" y="100" width="240" height="30" rx="10" fill="#BAC8B1"/>
    <text x="170" y="117" fill="#1A2318" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle">
      TẦNG 1: TRÌNH DIỄN (CLIENT TIER)
    </text>

    <!-- Component 1 -->
    <rect x="80" y="145" width="310" height="85" rx="8" fill="#EEF2EB" stroke="#7B9669" stroke-width="1.5"/>
    <text x="95" y="170" fill="#404E3B" font-size="14" font-weight="700">Giao diện Đặt vé &amp; Sơ đồ Rạp</text>
    <text x="95" y="190" fill="#3D4A38" font-size="12">• HTML5 Semantic &amp; Vanilla CSS3</text>
    <text x="95" y="208" fill="#3D4A38" font-size="12">• Sơ đồ ghế ma trận thời gian thực</text>

    <!-- Component 2 -->
    <rect x="445" y="145" width="310" height="85" rx="8" fill="#EEF2EB" stroke="#7B9669" stroke-width="1.5"/>
    <text x="460" y="170" fill="#404E3B" font-size="14" font-weight="700">Client Engine &amp; AJAX Fetch</text>
    <text x="460" y="190" fill="#3D4A38" font-size="12">• Fetch API gửi/nhận JSON Payload</text>
    <text x="460" y="208" fill="#3D4A38" font-size="12">• Client-side Form Validation &amp; A11y</text>

    <!-- Component 3 -->
    <rect x="810" y="145" width="310" height="85" rx="8" fill="#EEF2EB" stroke="#7B9669" stroke-width="1.5"/>
    <text x="825" y="170" fill="#404E3B" font-size="14" font-weight="700">Cổng Quản trị (Admin Portal)</text>
    <text x="825" y="190" fill="#3D4A38" font-size="12">• Dashboard quản lý suất chiếu &amp; phim</text>
    <text x="825" y="208" fill="#3D4A38" font-size="12">• Thống kê doanh thu phòng vé rạp</text>
  </g>

  <!-- Layer Separator: Dashed Line (Standard Notation for Layer Boundary) -->
  <line x1="60" y1="270" x2="1140" y2="270" stroke="#BAC8B1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Vertical Connectors Tier 1 -> Tier 2 (Solid 2.5px Lines) -->
  <line x1="235" y1="250" x2="235" y2="290" stroke="#7B9669" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="250" x2="600" y2="290" stroke="#7B9669" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="965" y1="250" x2="965" y2="290" stroke="#7B9669" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="490" y="260" width="220" height="20" rx="4" fill="#F7FAF5"/>
  <text x="600" y="274" fill="#404E3B" font-size="11" font-weight="700" text-anchor="middle">
    HTTP POST / GET • JSON Response
  </text>

  <!-- TIER 2: BUSINESS LOGIC TIER (PHP MVC) -->
  <g filter="url(#shadow)">
    <rect x="50" y="295" width="1100" height="195" rx="14" fill="#FFFFFF" stroke="#BAC8B1" stroke-width="1.5"/>
    <rect x="50" y="295" width="260" height="30" rx="10" fill="#7B9669"/>
    <text x="180" y="312" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle">
      TẦNG 2: NGHIỆP VỤ (PHP MVC CORE)
    </text>

    <!-- Controllers -->
    <rect x="75" y="340" width="315" height="130" rx="8" fill="#F4F7F2" stroke="#404E3B" stroke-width="1.5"/>
    <text x="90" y="365" fill="#404E3B" font-size="14" font-weight="700">Controller Layer (Điều phối)</text>
    <text x="90" y="387" fill="#3D4A38" font-size="12">• Router &amp; Request Dispatcher</text>
    <text x="90" y="405" fill="#3D4A38" font-size="12">• AuthController (Session, RBAC Phân quyền)</text>
    <text x="90" y="423" fill="#3D4A38" font-size="12">• BookingController (Giữ ghế, Thanh toán)</text>
    <text x="90" y="441" fill="#3D4A38" font-size="12">• MovieController &amp; ShowtimeController</text>

    <!-- Services -->
    <rect x="442" y="340" width="315" height="130" rx="8" fill="#F4F7F2" stroke="#404E3B" stroke-width="1.5"/>
    <text x="457" y="365" fill="#404E3B" font-size="14" font-weight="700">Service &amp; ACID Coordinator</text>
    <text x="457" y="387" fill="#3D4A38" font-size="12">• SeatLockingService (Khóa ghế chống race)</text>
    <text x="457" y="405" fill="#3D4A38" font-size="12">• TransactionManager (Begin, Commit, Rollback)</text>
    <text x="457" y="423" fill="#3D4A38" font-size="12">• TicketPricingService (Tính phụ thu VIP/Đôi)</text>
    <text x="457" y="441" fill="#3D4A38" font-size="12">• OrderNotificationService (Xuất vé điện tử)</text>

    <!-- Data Access -->
    <rect x="808" y="340" width="315" height="130" rx="8" fill="#F4F7F2" stroke="#404E3B" stroke-width="1.5"/>
    <text x="823" y="365" fill="#404E3B" font-size="14" font-weight="700">Data Access Layer (DAO / Repo)</text>
    <text x="823" y="387" fill="#3D4A38" font-size="12">• Database Singleton (PHP Data Objects PDO)</text>
    <text x="823" y="405" fill="#3D4A38" font-size="12">• Parameterized SQL chống SQL Injection</text>
    <text x="823" y="423" fill="#3D4A38" font-size="12">• Gọi Stored Procedures: sp_LockSeats...</text>
    <text x="823" y="441" fill="#3D4A38" font-size="12">• Map DTOs sang thực thể PHP Model</text>

    <!-- Horizontal Connectors inside Tier 2 (Solid 2.5px) -->
    <line x1="390" y1="405" x2="442" y2="405" stroke="#7B9669" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="757" y1="405" x2="808" y2="405" stroke="#7B9669" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Layer Separator: Dashed Line (Standard Notation for Layer Boundary) -->
  <line x1="60" y1="508" x2="1140" y2="508" stroke="#BAC8B1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Vertical Connectors Tier 2 -> Tier 3 (Orthogonal Routing) -->
  <path d="M 965 490 L 965 508 L 600 508 L 600 528" fill="none" stroke="#7B9669" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="420" y="498" width="360" height="20" rx="4" fill="#F7FAF5"/>
  <text x="600" y="512" fill="#404E3B" font-size="11" font-weight="700" text-anchor="middle">
    PDO Transact-SQL Driver • ACID Transactions (READ COMMITTED)
  </text>

  <!-- TIER 3: DATABASE TIER (MS SQL SERVER) -->
  <g filter="url(#shadow)">
    <rect x="50" y="530" width="1100" height="195" rx="14" fill="#FFFFFF" stroke="#BAC8B1" stroke-width="1.5"/>
    <rect x="50" y="530" width="310" height="30" rx="10" fill="#404E3B"/>
    <text x="205" y="547" fill="#E6E6E6" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle">
      TẦNG 3: CƠ SỞ DỮ LIỆU (MS SQL SERVER)
    </text>

    <!-- Tables -->
    <rect x="75" y="575" width="315" height="130" rx="8" fill="#EEF2EB" stroke="#6C8480" stroke-width="1.5"/>
    <text x="90" y="598" fill="#404E3B" font-size="14" font-weight="700">Bảng Thực thể Chuẩn 3NF</text>
    <text x="90" y="620" fill="#3D4A38" font-size="12">• Users, Roles (Phân quyền người dùng)</text>
    <text x="90" y="638" fill="#3D4A38" font-size="12">• Movies, Genres, Showtimes, Auditoriums</text>
    <text x="90" y="656" fill="#3D4A38" font-size="12">• Seats, SeatTypes, Tickets, Orders, Payments</text>
    <text x="90" y="674" fill="#3D4A38" font-size="12">• Khóa chính PK, Khóa ngoại FK toàn vẹn</text>

    <!-- Stored Procedures -->
    <rect x="442" y="575" width="315" height="130" rx="8" fill="#EEF2EB" stroke="#6C8480" stroke-width="1.5"/>
    <text x="457" y="598" fill="#404E3B" font-size="14" font-weight="700">Stored Procedures Tối ưu</text>
    <text x="457" y="620" fill="#3D4A38" font-size="12">• sp_LockSeatsForBooking (Khóa ghế có hạn)</text>
    <text x="457" y="638" fill="#3D4A38" font-size="12">• sp_ProcessTicketPayment (Tạo hóa đơn ACID)</text>
    <text x="457" y="656" fill="#3D4A38" font-size="12">• sp_CancelExpiredSeatLocks (Hủy ghế hết hạn)</text>
    <text x="457" y="674" fill="#3D4A38" font-size="12">• ROWLOCK &amp; UPDLOCK ngăn ngừa Deadlock</text>

    <!-- Views & Triggers -->
    <rect x="808" y="575" width="315" height="130" rx="8" fill="#EEF2EB" stroke="#6C8480" stroke-width="1.5"/>
    <text x="823" y="598" fill="#404E3B" font-size="14" font-weight="700">Views &amp; Toàn vẹn Dữ liệu</text>
    <text x="823" y="620" fill="#3D4A38" font-size="12">• v_AvailableSeatsOverview (Tình trạng rạp)</text>
    <text x="823" y="638" fill="#3D4A38" font-size="12">• v_DailyRevenueByMovie (Báo cáo doanh thu)</text>
    <text x="823" y="656" fill="#3D4A38" font-size="12">• Trigger trg_UpdateSeatStatusAfterOrder</text>
    <text x="823" y="674" fill="#3D4A38" font-size="12">• Sao lưu định kỳ &amp; phục hồi thảm họa</text>

    <!-- Horizontal Connectors inside Tier 3 (Solid 2.5px) -->
    <line x1="442" y1="640" x2="390" y2="640" stroke="#7B9669" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="757" y1="640" x2="808" y2="640" stroke="#7B9669" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
</svg>