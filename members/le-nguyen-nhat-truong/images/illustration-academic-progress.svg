<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="acadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#141B2B"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D00"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#acadBg)"/>

  <!-- Top Title Strip -->
  <rect x="30" y="20" width="740" height="44" fill="#1A2337" stroke="#2B3852" stroke-width="1.5" rx="3"/>
  <rect x="30" y="20" width="8" height="44" fill="#FF4D00"/>
  <text x="50" y="47" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#F8FAFC" letter-spacing="1">UTH K24 • BÁO CÁO TIẾN ĐỘ ĐÀO TẠO &amp; ĐIỂM HỌC THUẬT</text>
  <text x="610" y="47" font-family="'Courier New', monospace" font-size="11" fill="#10B981">KHÓA: 2024 - 2028</text>

  <!-- Left Card: Metrics Dashboard -->
  <g transform="translate(30, 80)">
    <!-- Credit Box -->
    <rect width="350" height="150" fill="#151D2E" stroke="#2B3852" stroke-width="1.5" rx="4"/>
    <text x="20" y="32" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#94A3B8">TIẾN ĐỘ TÍCH LŨY TÍN CHỈ</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#F8FAFC">77 <tspan font-size="20" fill="#64748B">/ 120 Tín chỉ</tspan></text>
    
    <!-- Progress Bar -->
    <rect x="20" y="95" width="310" height="14" fill="#0B0F19" stroke="#334155" stroke-width="1" rx="7"/>
    <rect x="20" y="95" width="199" height="14" fill="url(#barGrad)" rx="7"/>
    <text x="20" y="130" font-family="'Courier New', monospace" font-size="10.5" fill="#10B981">● 64.2% CHƯƠNG TRÌNH ĐÀO TẠO ĐÃ HOÀN THÀNH</text>

    <!-- GPA Box -->
    <g transform="translate(0, 165)">
      <rect width="350" height="175" fill="#151D2E" stroke="#2B3852" stroke-width="1.5" rx="4"/>
      <text x="20" y="32" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#94A3B8">ĐIỂM TRUNG BÌNH TÍCH LŨY (GPA)</text>
      <text x="20" y="78" font-family="'Segoe UI', sans-serif" font-size="40" font-weight="900" fill="#FF4D00">3.31 <tspan font-size="22" fill="#64748B">/ 4.0</tspan></text>
      <rect x="20" y="96" width="160" height="24" fill="rgba(255, 77, 0, 0.15)" stroke="#FF4D00" stroke-width="1" rx="3"/>
      <text x="30" y="112" font-family="'Courier New', monospace" font-size="10.5" font-weight="bold" fill="#FF7A33">XẾP LOẠI: KHÁ - GIỎI</text>
      <text x="20" y="145" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Phần lớn học phần chuyên ngành đạt điểm A và B+.</text>
      <text x="20" y="162" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Cam kết liêm chính học thuật: Không bịa chứng chỉ.</text>
    </g>
  </g>

  <!-- Right Card: Core Course Nodes -->
  <g transform="translate(400, 80)">
    <rect width="370" height="340" fill="#151D2E" stroke="#2B3852" stroke-width="1.5" rx="4"/>
    <text x="20" y="30" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#38BDF8">ĐIỂM CỐT LÕI CÁC MÔN NỀN TẢNG</text>
    <line x1="20" y1="42" x2="350" y2="42" stroke="#2B3852" stroke-width="1"/>

    <!-- Course 1 -->
    <g transform="translate(20, 56)">
      <rect width="330" height="46" fill="#101726" stroke="#1E293B" stroke-width="1" rx="3"/>
      <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">Lập trình Hướng đối tượng (Java SE 21)</text>
      <text x="14" y="37" font-family="'Courier New', monospace" font-size="9.5" fill="#64748B">KHOA CNTT UTH • 3 TÍN CHỈ</text>
      <rect x="270" y="10" width="48" height="26" fill="#10B981" rx="3"/>
      <text x="286" y="27" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#FFFFFF">A</text>
    </g>

    <!-- Course 2 -->
    <g transform="translate(20, 110)">
      <rect width="330" height="46" fill="#101726" stroke="#1E293B" stroke-width="1" rx="3"/>
      <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">Mạng máy tính &amp; Socket TCP/IP</text>
      <text x="14" y="37" font-family="'Courier New', monospace" font-size="9.5" fill="#64748B">ĐỒ ÁN REMOTE DESKTOP PRJ_UDM_06</text>
      <rect x="270" y="10" width="48" height="26" fill="#10B981" rx="3"/>
      <text x="286" y="27" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#FFFFFF">A</text>
    </g>

    <!-- Course 3 -->
    <g transform="translate(20, 164)">
      <rect width="330" height="46" fill="#101726" stroke="#1E293B" stroke-width="1" rx="3"/>
      <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">Hệ quản trị CSDL &amp; Chuẩn hóa 3NF</text>
      <text x="14" y="37" font-family="'Courier New', monospace" font-size="9.5" fill="#64748B">MYSQL 8.0 • ACID TRANSACTION</text>
      <rect x="270" y="10" width="48" height="26" fill="#10B981" rx="3"/>
      <text x="286" y="27" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#FFFFFF">A</text>
    </g>

    <!-- Course 4 -->
    <g transform="translate(20, 218)">
      <rect width="330" height="46" fill="#101726" stroke="#1E293B" stroke-width="1" rx="3"/>
      <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">Cấu trúc Dữ liệu &amp; Giải thuật (DSA)</text>
      <text x="14" y="37" font-family="'Courier New', monospace" font-size="9.5" fill="#64748B">50+ BÀI TOÁN LEETCODE PRACTICE</text>
      <rect x="270" y="10" width="48" height="26" fill="#10B981" rx="3"/>
      <text x="286" y="27" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#FFFFFF">A</text>
    </g>

    <!-- Course 5 -->
    <g transform="translate(20, 272)">
      <rect width="330" height="46" fill="#101726" stroke="#1E293B" stroke-width="1" rx="3"/>
      <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">Kiến trúc Máy tính &amp; Hệ điều hành</text>
      <text x="14" y="37" font-family="'Courier New', monospace" font-size="9.5" fill="#64748B">LINUX BASH • PROCESS MEMORY</text>
      <rect x="270" y="10" width="48" height="26" fill="#38BDF8" rx="3"/>
      <text x="282" y="27" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#0E1726">B+</text>
    </g>
  </g>
</svg>