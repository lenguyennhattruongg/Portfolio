<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#181F2E"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D00"/>
      <stop offset="50%" stop-color="#FF7A33"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#252E42" stroke-width="0.8" stroke-dasharray="2 4"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#gridPattern)"/>

  <!-- Top Terminal Header Strip -->
  <rect x="30" y="25" width="740" height="40" fill="#141B29" stroke="#2C384E" stroke-width="1.5" rx="3"/>
  <rect x="30" y="25" width="8" height="40" fill="#FF4D00"/>
  <text x="50" y="49" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#FF7A33" letter-spacing="1.5">UTH METRO LINE T24 // ARCHITECTURE SCHEMATIC</text>
  <text x="540" y="49" font-family="'Courier New', monospace" font-size="11" fill="#38BDF8">STATUS: NOMINAL (LIGHTHOUSE 98)</text>

  <!-- Metro Track Vector Path -->
  <path d="M 60 210 C 180 140, 260 280, 420 200 C 560 130, 640 260, 740 180" fill="none" stroke="#253147" stroke-width="14" stroke-linecap="round"/>
  <path d="M 60 210 C 180 140, 260 280, 420 200 C 560 130, 640 260, 740 180" fill="none" stroke="url(#trackGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- 4 Car Compartments (BAY-01 to BAY-04) -->
  <g transform="translate(60, 290)">
    <!-- BAY-01 -->
    <g transform="translate(0, 0)">
      <rect width="165" height="100" fill="#131926" stroke="#FF4D00" stroke-width="1.5" rx="3"/>
      <rect x="0" y="0" width="165" height="22" fill="#FF4D00"/>
      <text x="10" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FFFFFF">BAY-01: CORE ARCH</text>
      <text x="10" y="45" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F8FAFC">Java SE 21 Core</text>
      <text x="10" y="65" font-family="'Courier New', monospace" font-size="9.5" fill="#94A3B8">OOP Principles</text>
      <text x="10" y="82" font-family="'Courier New', monospace" font-size="9" fill="#FF7A33">● GRADE: A (4.0)</text>
    </g>

    <!-- BAY-02 -->
    <g transform="translate(180, 0)">
      <rect width="165" height="100" fill="#131926" stroke="#38BDF8" stroke-width="1.5" rx="3"/>
      <rect x="0" y="0" width="165" height="22" fill="#0284C7"/>
      <text x="10" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FFFFFF">BAY-02: TRANSPORT</text>
      <text x="10" y="45" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F8FAFC">Socket TCP / IP</text>
      <text x="10" y="65" font-family="'Courier New', monospace" font-size="9.5" fill="#94A3B8">Binary Protocol</text>
      <text x="10" y="82" font-family="'Courier New', monospace" font-size="9" fill="#38BDF8">● DEF_STREAM BUFFER</text>
    </g>

    <!-- BAY-03 -->
    <g transform="translate(360, 0)">
      <rect width="165" height="100" fill="#131926" stroke="#10B981" stroke-width="1.5" rx="3"/>
      <rect x="0" y="0" width="165" height="22" fill="#059669"/>
      <text x="10" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FFFFFF">BAY-03: PERSISTENCE</text>
      <text x="10" y="45" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F8FAFC">MySQL 8.0 3NF</text>
      <text x="10" y="65" font-family="'Courier New', monospace" font-size="9.5" fill="#94A3B8">ACID Transaction</text>
      <text x="10" y="82" font-family="'Courier New', monospace" font-size="9" fill="#10B981">● ROW LOCKING OK</text>
    </g>

    <!-- BAY-04 -->
    <g transform="translate(540, 0)">
      <rect width="165" height="100" fill="#131926" stroke="#F59E0B" stroke-width="1.5" rx="3"/>
      <rect x="0" y="0" width="165" height="22" fill="#D97706"/>
      <text x="10" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FFFFFF">BAY-04: INTERFACE</text>
      <text x="10" y="45" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F8FAFC">Vite MPA Bundler</text>
      <text x="10" y="65" font-family="'Courier New', monospace" font-size="9.5" fill="#94A3B8">Zero Libraries CSS</text>
      <text x="10" y="82" font-family="'Courier New', monospace" font-size="9" fill="#F59E0B">● RESPONSIVE 375-1920</text>
    </g>
  </g>

  <!-- 6 Station Waypoints along the track -->
  <!-- Ga 01 -->
  <circle cx="60" cy="210" r="10" fill="#FF4D00" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glow)"/>
  <text x="45" y="185" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FF4D00">GA 01</text>
  <text x="35" y="198" font-family="'Segoe UI', sans-serif" font-size="9" fill="#CBD5E1">Xuất Phát</text>

  <!-- Ga 02 -->
  <circle cx="205" cy="195" r="7" fill="#181F2E" stroke="#FF7A33" stroke-width="2"/>
  <text x="190" y="170" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#FF7A33">GA 02</text>
  <text x="185" y="182" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#CBD5E1">Về Tôi</text>

  <!-- Ga 03 -->
  <circle cx="340" cy="245" r="7" fill="#181F2E" stroke="#FF7A33" stroke-width="2"/>
  <text x="325" y="270" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#FF7A33">GA 03</text>
  <text x="315" y="282" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#CBD5E1">Khoang Tải</text>

  <!-- Ga 04 -->
  <circle cx="485" cy="165" r="8" fill="#181F2E" stroke="#38BDF8" stroke-width="2.5" filter="url(#glow)"/>
  <text x="470" y="140" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#38BDF8">GA 04</text>
  <text x="465" y="152" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#CBD5E1">Vé Đồ Án</text>

  <!-- Ga 05 -->
  <circle cx="615" cy="235" r="7" fill="#181F2E" stroke="#38BDF8" stroke-width="2"/>
  <text x="600" y="260" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#38BDF8">GA 05</text>
  <text x="595" y="272" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#CBD5E1">Lộ Trình</text>

  <!-- Ga 06 -->
  <circle cx="740" cy="180" r="10" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glow)"/>
  <text x="725" y="155" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#38BDF8">GA 06</text>
  <text x="715" y="168" font-family="'Segoe UI', sans-serif" font-size="9" fill="#CBD5E1">Điều Hành</text>
</svg>